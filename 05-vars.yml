- name: play level variables
  hosts: local
  connection: local
  vars:
    COURSE: "DEVOPS WITH AWS"
    DURATION: "140HRS"
    TRAINER: "Ramakrishna"
  tasks:
  - name: print variables
    vars:
      COURSE: ansible
      ansible.builtin.debug:
        msg: "Course is: {{ COURSE }}, Trainer is: {{ TRAINER }}"